version: "3.9"

services:
  # ===============================
  # Apollo Gateway
  # ===============================
  gateway:
    container_name: minshuku-gateway
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      # - subgraph-accounts
      # - subgraph-admin
      - subgraph-aiService
      - subgraph-amenities
      - subgraph-bookings
      # - subgraph-carts
      - subgraph-listings
      - subgraph-locations
      # - subgraph-payments
      # - subgraph-profiles
      - subgraph-reviews
      # - subgraph-temple
      - subgraph-users
      - machine
      - ai_service
    environment:
      # 👇 Gateway will use service names, not localhost
      USERS_SERVICE_URL: http://subgraph-users:4010/graphql
      MACHINE_SERVICE_URL: http://machine:9000/graphql
      AI_SERVICE_URL: http://ai_service:4100/graphql
    networks:
      - minshuku-net

  # ===============================
  # Node.js Subgraphs
  # ===============================
