directive @auth(
  requires: AuthRule
) on FIELD_DEFINITION

input AuthRule {
  # RBAC
  role: RoleRule

  # ABAC
  condition: ConditionRule
}

input RoleRule {
  any: [Role!]
  all: [Role!]
  not: [Role!]
}

input ConditionRule {
  owner: Boolean
  match: [MatchRule!]
}

input MatchRule {
  field: String!      # resource field
  equals: String      # context path
}


