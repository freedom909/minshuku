extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.8"
    import: ["@key", "@shareable", "@external", "@requires", "@provides", "@override", "@inaccessible"]
  )


scalar DateTime

type Booking @key(fields: "id") {
  id: ID!
  bookingNumber: String! @shareable
  isFeatured: Boolean! @shareable
  reservedDate: DateTime! @shareable
  "The listing associated with the reservation"
  listing: Listing! @shareable
  "The guest that reserved the location"
  guest: Guest! @shareable
  "The review associated with the reservation"
  review: Review @shareable
  "The guest that reserved the location"
  checkInDate: String! @shareable
  "Check-out date for the reservation"
  checkOutDate: String! @shareable
  "Total price price, calculated using the listing's price and the check-in check-out dates"
  totalPrice: Float! @shareable
  "The status of the booking - check BookingStatus type for all possibilities"
  status: BookingStatus! @shareable
  "The booking was cancelled time"
  cancelledAt: DateTime @shareable
  "The booking was confirmed time"
  confirmedAt: DateTime @shareable
}

type Listing @key(fields: "id") {
  id: ID! @shareable
  "The list of bookings for a listing"
  bookings: [Booking]! @shareable
  title:String! @shareable
  description:String!@shareable
  pictures:[String]!@shareable
  "The host of the listing"
  host: User @shareable
  "The price per night for the listing"
  price: Float!@shareable
  "The total number of bookings for the listing"
  bookingsCount: Int!@shareable
  "The total number of reviews for the listing"
  reviewsCount: Int!@shareable
  checkInDate: String!@shareable
  checkOutDate: String! @shareable
  "The total number of bookings for the listing"
  numOfGuests:Int! @shareable
  "The status of the listing - check ListingStatus type for all possibilities"
  numOfBeds:Int! @shareable
  "The status of the listing - check ListingStatus type for all possibilities"
  status: ListingStatus! 
  "The average rating for the listing"
  averageRating: Float! @shareable
  "The total amount of money made from the listing"
  saleAmount:Float! @shareable
}

type Guest @key(fields: "id") {
  id: ID!
  "The list of bookings for a guest"
  bookings: [Booking]! @shareable
  role:Role! @shareable
}

type Host @key(fields: "id") {
  id: ID!
  "The list of bookings for a host"
  Listings: [Listing]! @shareable
  role:Role @shareable
}

enum Role {
  ADMIN
  GUEST
  HOST
}

"The status of a booking"
enum BookingStatus {
  CURRENT
  COMPLETED
  UPCOMING
  PAST
  CANCELLED
  CONFIRMED
}

"The status of a listing"
enum ListingStatus {
  ACTIVE
  PENDING
  SOLD
  DELETED
  REJECT
  CANCELLED
  EXPIRED
  COMPLETED
}

interface User {
  id: ID!
  email: String!
  name: String!
  role: Role!
}

type Review @key(fields: "id") {
  id: ID!
}

interface MutationResponse {
  "Similar to HTTP status code, represents the status of the mutation"
  code: Int!
  "Indicates whether the mutation was successful"
  success: Boolean!
  "Human-readable message for the UI"
  message: String!
}

"The response after creating a booking."
type CreateBookingResponse implements MutationResponse {
  "Similar to HTTP status code, represents the status of the mutation"
  code: Int! @shareable
  "Indicates whether the mutation was successful"
  success: Boolean! @shareable
  "Human-readable message for the UI"
  message: String! @shareable
  "The newly-created booking"
  booking: Booking @shareable
}

"Fields for creating a booking"
input CreateBookingInput {
  "ID of the listing associated with the booking"
  listingId: ID!
  "Booking number for the reservation"
  bookingNumber: String
  "Indicates if the booking is featured"
  isFeatured: Boolean
  "Reserved date for the booking"
  reservedDate: DateTime
  "Date of check-in"
  checkInDate: DateTime!
  "Date of check-out"
  checkOutDate: DateTime!
  "Guest ID associated with the booking"
  guestId: ID!
}

input AddToCartInput {
  listingId: ID!
  guestId: ID!
  checkInDate: DateTime!
  checkOutDate: DateTime!
}

input RemoveFromCartInput {
  cartItemId: ID!
  guestId: ID!
}

input UpdateFromCartInput {
  cartItemId: ID!
  checkInDate: DateTime!
  checkOutDate: DateTime!
}

type UpdateBookingResponse{
  code: Int! @shareable
  success: Boolean! @shareable
  message: String! @shareable
  booking: Booking! @shareable
}
type AddToCartResponse implements MutationResponse {
  code: Int! @shareable
  success: Boolean! @shareable
  message: String! @shareable
  cartItem: CartItem @shareable
}

type RemoveFromCartResponse implements MutationResponse {
  code: Int! @shareable
  success: Boolean! @shareable
  message: String! @shareable
  cartItem: CartItem @shareable
}

type CartItem {
  id: ID! 
  listing: Listing! @shareable
  guest: Guest! @shareable
  checkInDate: DateTime! @shareable
  checkOutDate: DateTime! @shareable
}

type Mutation {
  addToCart(input: AddToCartInput!): AddToCartResponse! @shareable
  "Admin remove a booking from cart."
  removeFromCart(input: RemoveFromCartInput!): RemoveFromCartResponse! @shareable

  "Admin update a booking."
  updateBooking(input: UpdateBookingInput): UpdateBookingResponse @shareable
  updateCartItem(input:UpdateFromCartInput):UpdateFromCartInputResponse! @shareable
  "Guest create a booking."
  createBooking(input: CreateBookingInput!): CreateBookingResponse! @shareable
  "Research booking information according to guestId."
  researchBooking(guestId: ID!): [Booking!]! @shareable
  "Guest confirms the status of booking."
  confirmBooking(id: ID!): Booking! @shareable 
  "Guest cancels the status of booking."
  cancelBooking(id: ID!): CancelBookingResponse! @shareable
}

type CancelBookingResponse implements MutationResponse {
  "Similar to HTTP status code, represents the status of the mutation"
  code: Int! @shareable
  "Indicates whether the mutation was successful"
  success: Boolean! @shareable
  "Human-readable message for the UI"
  message: String! @shareable
  "The newly-created booking"
  booking: Booking @shareable
}

input UpdateBookingInput{
  id: ID!
  checkInDate: DateTime!
  checkOutDate: DateTime!  
}

type Query {
  "Get all bookings."
  bookings: [Booking!]! @shareable
  getBookingsByUser(userId: ID!): [Booking] @shareable
  getBookingById(id: ID!): Booking @shareable
}

type UpdateFromCartInputResponse{
  code: Int!
  success: Boolean!
  message: String!
  cartItem: CartItem!
}