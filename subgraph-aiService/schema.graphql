# ==============================
# AI-Service Subgraph Schema (Federation-ready)
# ==============================

# -----------------------------
# Apollo Federation link
# -----------------------------
schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.5",
    import: ["@key", "@shareable", "@external"]
  ) {
  query: Query
  mutation: Mutation
}

scalar DateTime

# -----------------------------
# Output types
# -----------------------------
type AIResult @shareable {
  suggestion: String!
  confidence: Float
  isSuitable: Boolean!
  createdAt: DateTime!
}

type PerformanceTip @shareable {
  tip: String!
  impactScore: Int
}

type ListingSuggestion {
  suggestion: String!
}

type DescriptionSuggestion {
  suggestion: String!
}

type ReviewReply {
  reply: String!
}

type SmartSuggestionsResult {
  suggestions: [String!]!
}

type AIChatReply {
  reply: String!
}

type Booking {
  guestId: ID!
  startDate: String!
  endDate: String!
}

type ListingInfo {
  id: ID!
  title: String!
  description: String
  bookings: [Booking]
  currentlyBookedDates: [String]
}

type TitleSuggestionResponse {
  suggestions: [String!]!
}

# -----------------------------
# Extend external entities
# -----------------------------
extend type Listing @key(fields: "id") {
  id: ID! @external
}

extend type Booking @key(fields: "id") {
  id: ID! @external
}

# -----------------------------
# Query types
# -----------------------------
type Query {
  # Minimal subgraph queries
  getSmartSuggestions(userId: ID!): SmartSuggestionsResult!
  sendMessageToAI(message: String!): AIChatReply!
  getListingInfo(listingTitle: String!): ListingInfo!

  # AIService-specific queries
  suggestTitleImprovements(listingId: ID!): AIResult
  generateDescriptionSuggestions(listingId: ID!): AIResult
  getPerformanceTips(bookingId: ID!): [PerformanceTip!]!
}

# -----------------------------
# Mutation types
# -----------------------------
type Mutation {
  # Minimal subgraph mutations
  applyTitleSuggestion(listingId: ID!): ListingSuggestion!
  applyDescriptionSuggestion(listingId: ID!): DescriptionSuggestion!
  replyToReview(reviewId: ID!, reviewText: String!): ReviewReply!

  # AIService-specific mutations
  generateReplyToReview(reviewId: ID!): AIResult
  suggestTitleImprovements(listingId: ID!): TitleSuggestionResponse
  # applyTitleSuggestion(listingId: ID!, reviewId: ID!): AIResult
  saveDescriptionSuggestions(listingId: ID!): [AIResult!]!
  draftReplyToReview(reviewId: ID!, suggestion: String!): Boolean
}
