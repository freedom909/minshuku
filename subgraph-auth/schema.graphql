# users schema.graphql
schema
  @link(url: "https://specs.apollo.dev/federation/v2.8", import: ["@key", "@shareable"]) {
  query: Query
  mutation: Mutation
}

# Enums (authoritative; MUST match other subgraphs)
enum Role {
  USER
  GUEST
  HOST
  PENDING_HOST
  ADMIN
}

# Scalars
scalar DateTime

# Common Response interface
interface Response {
  code: Int!
  success: Boolean!
  message: String!
}

# Canonical User interface (authoritative)
interface User @key(fields: "id") {
  id: ID!
  email: String!
  fullName: String
  firstName: String!
  lastName: String!
  picture: String!
  nickname: String!
  role: Role!
  provider: OAuthProvider
  oauthId: String!
  createdAt: String!   # ✅ add
  updatedAt: String!   # ✅ add
}


# Concrete types implementing User — USERS subgraph OWNS the concrete fields
type Guest implements User @key(fields: "id") {
  id: ID!
  email: String!
  name: String
  role: Role!
  isVerified: Boolean!
  isLocked: Boolean!
  createdAt: String!
  updatedAt: String!

  # extra fields specific to users facing auth/profile
  fullName: String
  firstName: String!
  lastName: String!
  picture: String!
  nickname: String!
  provider: OAuthProvider
  oauthId: String!
  # tokens stored/returned by auth flows (if needed)
  idToken: String
  accessToken: String
  refreshToken: String
}

type Host implements User @key(fields: "id") {
  id: ID!
  email: String!
  name: String
  role: Role!
  isVerified: Boolean!
  isLocked: Boolean!
  createdAt: String!
  updatedAt: String!

  # host-specific fields
  fullName: String!
  firstName: String!
  lastName: String!
  picture: String!
  nickname: String!
  provider: OAuthProvider
  oauthId: String!
  idToken: String
  accessToken: String
  refreshToken: String
  description: String
}

# Admin type must exist in users subgraph and implement User (authoritative owner)
type Admin implements User @key(fields: "id") {
  id: ID!
  email: String!
  name: String
  role: Role!
  isVerified: Boolean!
  isLocked: Boolean!
  createdAt: String!
  updatedAt: String!

  # admin-specific fields
  fullName: String
  firstName: String!
  lastName: String!
  picture: String!
  nickname: String!
  provider: OAuthProvider
  oauthId: String!
}

# Inputs, Responses, Auth payloads etc. (kept from your original)
enum OAuthProvider {
  GOOGLE
  FACEBOOK
  APPLE
  GITHUB
  LOCAL
}

input VerifyHostInput {
  id: ID!
  idNumber: String!
  faceImageUrl: String!
}

input SignInInput {
  email: String
  password: String
  provider: OAuthProvider
  token: String
  refreshToken: String
  oauthId: String
  idToken: String
  accessToken: String
}

input SignUpInput {
  email: String!
  password: String!
  name: String!
  nickname: String!
  role: Role = GUEST
  picture: String!
  inviteCode: String
}

input OAuthLoginInput {
  provider: OAuthProvider!
  providerAccountId: String!
}

input UpdatePasswordInput {
  userId: ID!
  newPassword: String!
  password: String!
}

type AuthPayload {
  token: String!
  userId: ID!
  role: Role!
}

type OAuthLoginPayload {
  accessToken: String!
  user: User!
}

type SignInResponse implements Response {
  code: Int!
  success: Boolean!
  message: String!
  auth: AuthPayload
  refreshToken: String
  role: Role
  userId: ID
}

type ReqResetPwdResponse implements Response {
  code: Int!
  success: Boolean!
  message: String!
  link: String!
}

type ForgotPasswordResponse implements Response {
  code: Int!
  success: Boolean!
  message: String!
  email: String!
}

type InviteCodeResponse implements Response {
  code: Int!
  success: Boolean!
  message: String!
}

input UpdateUserInput {
  name: String
  picture: String
  role: Role
}

# Queries and Mutations — USERS subgraph owns these resolvers
type Query {
  getUser(id: ID!): User @shareable
  me: User @shareable 
  user(id: ID!): User @shareable
  users: [User]!@shareable
}

type Mutation {
  oauthLogin(input: OAuthLoginInput!): OAuthLoginPayload!
  verifyAndUpgradeHost(input: VerifyHostInput!): AuthPayload!
  signUp(input: SignUpInput!): SignInResponse!
  signIn(input: SignInInput!): SignInResponse!
  oauthSaveUser(input: OAuthInput!): AuthPayload!
  updatePassword(input: UpdatePasswordInput!): AuthPayload!
  requestResetPassword(email: String!): ReqResetPwdResponse!
  forgotPassword(email: String!): ForgotPasswordResponse!
  sendInviteCode(email: String!): InviteCodeResponse!
  logout(provider: OAuthProvider): Boolean!
  createUser(name: String!, email: String!): User
  updateUser(id: ID!, input: UpdateUserInput!): User
  verifyGoogleToken(token: String): AuthPayload
  verifyFacebookToken(token: String): AuthPayload
  verifyAppleToken(token: String): AuthPayload
  verifyTwitterToken(token: String): AuthPayload
}

input OAuthInput {
  provider: OAuthProvider!
  token: String!
  refreshToken: String
  email: String
  name: String
}

# If you use federation _Entity union, include all types you want to resolve across subgraphs
union _Entity = Guest | Host | Admin
