# subgraph-accounts/schema.graphql
extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.8",
    import: ["@key", "@shareable", "@external"]
  )

# Define the User interface as a stub from the users subgraph
interface User @key(fields: "id") {
  id: ID!
}

# Extend concrete User types from the users subgraph
extend type Guest implements User @key(fields: "id") {
  id: ID! @external
  # email: String! @external # Only needed if used by a resolver in this subgraph
  # role: Role! @external # Only needed if used by a resolver in this subgraph
  # Add any other fields from Guest that 'accounts' needs to reference
  # e.g., isVerified: Boolean! @external
}

extend type Host implements User @key(fields: "id") {
  id: ID! @external
  # Add any other fields from Host that 'accounts' needs to reference
  # e.g., description: String @external
}

extend type Admin implements User @key(fields: "id") {
  id: ID! @external
  # email: String! @external
  # role: Role! @external
}

# Define types that are owned by the accounts subgraph
type Account @key(fields: "id") {
  id: ID!
  email: String!
  createdAt: DateTime!
  # Add other account-specific fields here
}

# Define the BecomeHostInput and BecomeHostResponse
input BecomeHostInput {
  frontKey: String!
  backKey: String!
  selfieKey: String!
}

type BecomeHostResponse {
  success: Boolean!
  message: String!
  user: Guest # Return a concrete type or the User interface if defined correctly
}

# Define the mutation owned by the accounts subgraph
extend type Mutation {
  becomeHost(input: BecomeHostInput!): BecomeHostResponse!
}

# NOTE: The 'bookings' and 'listings' subgraphs are currently disabled in the gateway.
# These extensions are commented out to allow schema composition.
# To use them, enable the corresponding subgraphs in gateway/index.js.
# extend type Booking @key(fields: "id") @external {
#   id: ID! @external
# }
# extend type Listing @key(fields: "id") @external {
#   id: ID! @external
# }

# Re-declare the Role enum for consistency if it's used in this subgraph's types
extend enum Role {
  USER
  GUEST
  HOST
  PENDING_HOST
  ADMIN
}

# Scalar for DateTime
scalar DateTime