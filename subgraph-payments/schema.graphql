extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.8", 
        import: ["@key", "@shareable"])
enum CacheControlScope {  
  PUBLIC  
  PRIVATE  
  INHERIT  
}
scalar DateTime
directive @cacheControl(maxAge: Int, scope: CacheControlScope) on FIELD_DEFINITION | OBJECT | INTERFACE  

# Query type for fetching payment information
type Query {
  """
  Fetch the payment information. The return value represents the payment amount.
  """
  payment: Int @shareable
}

# Mutation type for wallet operations and payment processing
type Mutation {
  addFunds(userId: ID!, amount: Float!): Float! @shareable
  subtractFunds(userId: ID!, amount: Float!): Float! @shareable
}

# Payment processing input

# Represents the funds of a user
type Funds {
  userId: ID!
  amount: Float!
}

# Represents a payment transaction
type Payment {
  id: ID!
  userId: ID!
  amount: Float!
  date: DateTime!
  type: String! # e.g., 'DEPOSIT', 'WITHDRAWAL'
}

# Payment processing input
input PaymentProcessingInput {
  userId: ID!
  amount: Float!
}

# Refund processing input
input RefundProcessingInput {
  userId: ID!
  amount: Float!
}

# Mutation type for wallet operations
type Mutation {
  """
  Add funds to the user's wallet.
  @param amount: The amount of funds to be added.
  @returns: The response of adding funds to the wallet.
  """
  addFundsToWallet(amount: Float!): AddFundsToWalletResponse! @shareable
  processPayment(input: PaymentProcessingInput!): PaymentProcessingResponse! @shareable
  processRefund(input: RefundProcessingInput!): RefundProcessingResponse! @shareable
  """
  Cancel a booking and refund the guest.
  @param id: The ID of the booking to be cancelled.
  @returns: The response of cancelling the booking.
  """
  cancelBooking(id: ID!): CancelBookingResponse! @shareable
}

# User interface with common user fields
interface User {
  id: ID!
  name: String!
  picture: String!
}

# Interface for mutation responses
interface MutationResponse {
  code: Int!
  success: Boolean!
  message: String!
}

# Response type for addFundsToWallet mutation

# Response type for payment processing
 type PaymentProcessingResponse implements MutationResponse {
  code: Int! @shareable
  success: Boolean! @shareable
  message: String! @shareable
}

# Response type for refund processing
 type RefundProcessingResponse implements MutationResponse {
  code: Int! @shareable
  success: Boolean! @shareable
  message: String! @shareable
}

# Response type for addFundsToWallet mutation
type AddFundsToWalletResponse implements MutationResponse {
  code: Int! @shareable
  success: Boolean! @shareable
  message: String! @shareable
  amount: Float @shareable
}

type Booking @key(fields: "id") {
  id: ID!
  listing: Listing! @shareable
  guest: Guest! @shareable
}

type Listing @key(fields: "id") {
  id: ID!
  "The list of bookings for a listing"
  bookings: [Booking]! @shareable
}

# Response type for cancelBooking mutation
type CancelBookingResponse implements MutationResponse {
  "Similar to HTTP status code, represents the status of the mutation"
  code: Int! @shareable
  "Indicates whether the mutation was successful"
  success: Boolean! @shareable
  "Human-readable message for the UI"
  message: String! @shareable
  "The newly-created booking"
  booking: Booking @shareable
  "The amount of money refunded to the guest"
  refundAmount: Float! @shareable
}

# Guest type implementing User interface with federated key
type Guest implements User @key(fields: "id") {
  id: ID!
  name: String! @shareable
  funds: Float! @shareable
  picture: String! @shareable
}

# Host type implementing User interface with federated key
type Host implements User @key(fields: "id") {
  id: ID!
  name: String! @shareable
  earnings: Float! @shareable
  "The HOST's profile photo URL"
  picture: String! @shareable
}

