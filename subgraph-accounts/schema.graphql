# accounts.graphql
extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.8",
    import: ["@key", "@shareable", "@external", "@provides"]
  )

# --------------------------
# SCALARS
# --------------------------
scalar DateTime

# --------------------------
# QUERIES
# --------------------------
type Query {
  me: User @shareable
  user(id: ID!): User @shareable
  users: [User!]! @shareable
  userDashboard(userId: ID!): UserDashboard
  account(id: ID!): Account
  accounts: [Account!]
  viewer: Account
}

# --------------------------
# MUTATIONS
# --------------------------
type Mutation {
  updateUserProfile(input: UpdateUserInput!): User @shareable
  deleteUser(id: ID!): Boolean @shareable
  createUser(name: String!, email: String!, password: String): User @shareable
  updateUser(id: ID!, input: UpdateUserInput): User @shareable
  createAccount(input: CreateAccountInput!): Account
  deleteAccount(id: ID!): Boolean
  updateAccountEmail(input: UpdateAccountEmailInput!): Account
  updateAccountPassword(input: UpdateAccountPasswordInput!): Boolean
  updateProfile(id: ID!, input: UpdateUserInput!): User @shareable
}

# --------------------------
# USER INTERFACE & TYPES
# --------------------------
interface User @key(fields: "id") {
  id: ID!
  name: String!
  email: String!
  avatar: String
  role: Role
  joinedAt: DateTime
}

type Guest implements User @key(fields: "id") {
  id: ID! @shareable
  name: String! @shareable
  email: String! @shareable
  avatar: String @shareable
  role: Role @shareable
  joinedAt: DateTime @shareable
  bookings: [Booking!] @shareable
}

type Host implements User @key(fields: "id") {
  id: ID! @shareable
  name: String! @shareable
  email: String! @shareable
  avatar: String @shareable
  role: Role @shareable
  joinedAt: DateTime @shareable
  listings: [Listing!] @shareable
}

# External types from other subgraphs
extend type Booking @key(fields: "id") {
  id: ID! @external
}

extend type Listing @key(fields: "id") {
  id: ID! @external
}

# --------------------------
# ENUMS
# --------------------------
enum Role {
  ADMIN
  HOST
  GUEST
  USER
}

# --------------------------
# DASHBOARD TYPES
# --------------------------
type UserDashboard {
  user: User
  totalListings: Int
  totalBookings: Int
  recentBookings: [Booking!]
  recentListings: [Listing!]
  notifications: [Notification!]
}

type BookingSummary {
  id: ID!
  listingTitle: String
  checkIn: DateTime
  checkOut: DateTime
  totalPrice: Float
  createdAt: DateTime
}

type ListingSummary {
  id: ID!
  title: String
  price: Float
  imageUrl: String
  createdAt: DateTime
}

type Notification {
  id: ID!
  message: String!
  createdAt: DateTime!
}

# --------------------------
# ACCOUNT TYPE
# --------------------------
type Account @key(fields: "id") {
  id: ID!
  email: String!
  createdAt: DateTime!
}

# --------------------------
# INPUT TYPES
# --------------------------
input UpdateUserInput {
  name: String
  avatar: String
  role: Role
}

input CreateAccountInput {
  email: String!
  password: String!
}

input UpdateAccountEmailInput {
  id: ID!
  email: String!
}

input UpdateAccountPasswordInput {
  id: ID!
  newPassword: String!
  password: String!
}
