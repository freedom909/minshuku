# ======================
# aiService SDL (Federation-safe)
# ======================

# Federation links
schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.8",
    import: ["@key", "@shareable", "@external"]
  ) {
  query: Query
}

# ======================
# SCALARS
# ======================
scalar DateTime

# ======================
# AI Result type
# ======================
type AIResult @shareable {
  suggestion: String!
}

# ======================
# Extend external entities
# ======================

# Reference Listing from listings subgraph
extend type Listing @key(fields: "id") {
  id: ID! @external
}

# Reference Booking from bookings subgraph
extend type Booking @key(fields: "id") {
  id: ID! @external
}

# Reference User from users subgraph
extend interface User @key(fields: "id") {
  id: ID! @external
}

# ======================
# QUERIES
# ======================
type Query {
  # AI suggestions for listings and reviews
  suggestTitleImprovements(listingId: ID!): AIResult
  generateDescriptionSuggestions(listingId: ID!): AIResult
  generateReplyToReview(reviewId: ID!): AIResult
}
