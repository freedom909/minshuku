extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.5"
    import: ["@key", "@shareable", "@external", "@requires", "@provides", "@override", "@inaccessible"]
  )


type Query  {
  "Returns a list of reviews for a given listing"
  searchReviews(input: SearchReviewsInput!): [Review] @shareable
  reviewsForListing(listingId: ID!): [Review] @shareable
  review(id: ID!): [Review] @shareable
  "Returns all reviews in the system"
  allReviews: [Review] @shareable
}

type Mutation {
  "Creates a review for the guest - must be authored by the host of a past booking"
  submitGuestReview(
    guestReview: ReviewInput!
    bookingId: ID!
  ): SubmitGuestReviewResponse! 

  "Creates a review for the host and location - only authorized users (hosts) can submit"
  submitHostAndLocationReviews(
    bookingId: ID!
    hostReview: ReviewInput!
    locationReview: ReviewInput!
  ): SubmitHostAndLocationReviewsResponse!
}
directive @relation(name: String!, direction: String!) on FIELD_DEFINITION

### Reviews
type Review @key(fields: "id") {
  id: ID!
  content: String! @shareable
  rating: Float! @shareable
  author: User! @relation(name: "AUTHORED_BY", direction: OUT) @shareable
  booking: Booking! @relation(name: "ASSOCIATED_WITH", direction: OUT) @shareable
  location: Location @relation(name: "BELONGS_TO", direction: OUT) @shareable
  guest: Guest @relation(name: "SUBMITTED_BY", direction: OUT) @shareable
  host: Host @relation(name: "REVIEWED_BY", direction: OUT) @shareable
  likes: [Like!] @relation(name: "HAS_LIKE", direction: OUT) @shareable
  dislikes: [Like!] @relation(name: "HAS_DISLIKE", direction: OUT) @shareable
  comments: [Comment!] @relation(name: "HAS_COMMENT", direction: OUT) @shareable
  round: Int ! @shareable
  isPinned: Boolean! @shareable
  isRecommended: Boolean! @shareable
  createdAt: String!
  updatedAt: String!
}

enum ReviewSortField {
  RATING
  CREATED_AT
  UPDATED_AT
}

enum SortOrder {
  ASC
  DESC
}

input SearchReviewsInput {
  id: ID
  guestId: ID
  authorId: ID
  listingId: ID
  hostId: ID
  targetType: String
  content: String # full-text search support
  rating: Float
  round: Int
  isPinned: Boolean
  isRecommended: Boolean

  # Pagination
  limit: Int
  offset: Int

  # Sorting
  sortBy: ReviewSortField
  sortOrder: SortOrder
}

### Likes
type Like {
  id: ID!
  userId: ID!
  reviewId: ID!
  createdAt: String! 
  updatedAt: String!
  isPositive: Boolean! 
}

### Location Type
type Location @key(fields: "id") {
  id: ID! @shareable
  name: String! @shareable
}

### Input Types
input ReviewInput {
  content: String!
  rating: Float!
  locationId: ID
  guestId: ID
  bookingId: ID
  round: Int!
  hostId: ID
}

### Response Types
type SubmitHostAndLocationReviewsResponse implements MutationResponse {
  code: Int! @shareable
  success: Boolean! @shareable
  message: String! @shareable
  hostReview: Review @shareable
  locationReview: Review @shareable
}

type SubmitGuestReviewResponse implements MutationResponse {
  code: Int! @shareable
  success: Boolean! @shareable
  message: String! @shareable
  guestReview: Review @shareable
}

interface MutationResponse {
  code: Int!
  success: Boolean!
  message: String!
}

### Bookings
type Booking @key(fields: "id") {
  id: ID! @shareable
}

### Listings
type Listing @key(fields: "id") {
  id: ID! @shareable
}

### Enums
enum Role {
  HOST
  GUEST
  ADMIN
  USER
}

### User Types
interface User {
  id: ID!
  name: String
  "The user's profile photo URL"
  picture: String!  
  role:Role
}

type Host implements User @key(fields: "id") {
  role: Role @shareable
  id: ID! @shareable
  name: String! @shareable
  overallRating: Float @shareable
  picture: String! @shareable
  locationReviews: [Review!] @relation(name: "REVIEWED_BY", direction: IN)
  hostReviews: [Review!] @relation(name: "REVIEWED_BY", direction: IN)
  bookings: [Booking!] @relation(name: "BOOKED_BY", direction: IN)@shareable
  listings: [Listing!] @relation(name: "HOSTED_BY", direction: IN) @shareable
}
 
type Guest implements User @key(fields: "id") {
  id: ID! @shareable 
  name: String! @shareable
  picture: String! @shareable
  role: Role @shareable
  overallRating: Float @shareable
  locationReviews: [Review!] @relation(name: "REVIEWED_BY", direction: IN)
  hostReviews: [Review!] @relation(name: "REVIEWED_BY", direction: IN)
  bookings: [Booking!] @relation(name: "BOOKED_BY", direction: IN)@shareable
  listings: [Listing!] @relation(name: "HOSTED_BY", direction: IN) @shareable
}

type Comment {
  id: ID!
  content: String! @shareable
  author: User! @shareable
  review: Review! @shareable
  createdAt: String! @shareable 
  updatedAt: String! @shareable
}
