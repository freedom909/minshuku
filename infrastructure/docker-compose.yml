  #     dockerfile: Dockerfile
  #   ports:
  #     - "4102:4102"
  #   networks:
  #     - minshuku-net

  subgraph-aiService:
    container_name: minshuku-subgraph-aiService
    build:
      context: ./subgraph-aiService
      dockerfile: Dockerfile
    ports:
      - "4100:4100"
    networks:
      - minshuku-net

  subgraph-amenities:
    container_name: minshuku-amenities
    build:
      context: ./subgraph-amenities
      dockerfile: Dockerfile
    ports:
      - "4090:4090"
    networks:
      - minshuku-net

  subgraph-bookings:
    container_name: minshuku-bookings
    build:
      context: ./subgraph-bookings
      dockerfile: Dockerfile
    ports:
      - "4050:4050"
    networks:
      - minshuku-net

  # subgraph-carts:
