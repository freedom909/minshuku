spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
        - id: listing-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/listings/**

user-service:
  port: 8081

listing-service:
  port: 8082