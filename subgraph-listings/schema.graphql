schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.8",
    import: ["@key", "@shareable", "@external"]
  ) {
  query: Query
  mutation: Mutation
}

scalar DateTime

enum ListingStatus {
  ACTIVE
  PENDING
  SOLD
  DELETED
  REJECT
  CANCELLED
  EXPIRED
  COMPLETED
}
enum LocationType {
  HOUSE
  APARTMENT
  COTTAGE
  VILLA
  SPACESHIP
  ROOM
  CAMPSITE
}
enum AmenityCategory {
  ACCOMMODATION_DETAILS
  SPACE_SURVIVAL
  OUTDOORS
  UNKNOWN
}

type PriceRange {
  min: Float @shareable
  max: Float @shareable
}
type TotalCostRange {
  min: Float! @shareable
  max: Float! @shareable
}
type ReservedDate {
  checkInDate: DateTime! @shareable
  checkOutDate: DateTime! @shareable
}

# ---- Entities this subgraph OWNS
type Listing @key(fields: "id")  {
  id: ID!
  title: String! @shareable
  description: String @shareable
  pictures: [String] @shareable
  numOfBeds: Int @shareable
  price: Float @shareable
  isFeatured: Boolean @shareable
  saleAmount: Float @shareable
  checkInDate: String @shareable
  checkOutDate: String @shareable
  distance: Float @shareable
  location: Location!    
  locationId: ID! @shareable      # federated entity
  locationType: LocationType @shareable
  amenities: [Amenity!]!   
  amenityIds: [ID!]! @shareable   # federated entity# federated entity
  bookingNumber: Int @shareable
  currentlyBookedDates: [String] @shareable
  totalCost: Float @shareable
  bookings: [Booking]! @shareable
  availability: [ReservedDate] @shareable
  priceRange: PriceRange @shareable
  totalCostRange: TotalCostRange @shareable
}

# ---- Entities OWNED by other subgraphs
extend type Amenity @key(fields: "id") {
  id: ID! @external
}
extend type Location @key(fields: "id") {
  id: ID! @external
}
extend type Booking @key(fields: "id") { id: ID! }
extend type Review  @key(fields: "id") { id: ID! }
extend type Guest   @key(fields: "id") { id: ID! }
extend type Host    @key(fields: "id") { id: ID! }

# ---- Inputs
input UpdateListingStatusInput {
  id: ID!
  listingStatus: ListingStatus!
}

input UpdateListingInput {
  title: String
  description: String
  pictures: [String!]
  numOfBeds: Int
  price: Float
  locationType: LocationType
  amenityIds: [ID!]
}

input CreateListingInput {
  title: String!
  description: String!
  locationId: ID!                # reference to Location entity
  hostId: String!
  pictures: [String!]!
  numOfBeds: Int!
  price: Float!
  locationType: LocationType!
  amenityIds: [ID!]!              # references to Amenity entities
  listingStatus: ListingStatus
  checkInDate: String!
  checkOutDate: String!
  isFeatured: Boolean
}

input FullTextSearchInput {
  searchText: String!
  limit: Int
  offset: Int
}

interface Response {
  code: Int!
  success: Boolean!
  message: String!
}

type CreateListingResponse implements Response {
  code: Int! @shareable
  success: Boolean! @shareable
  message: String! @shareable
  listing: Listing @shareable
}
type UpdateListingResponse implements Response {
  code: Int! @shareable
  success: Boolean! @shareable
  message: String! @shareable
  listing: Listing @shareable
}
type UpdateListingStatusResponse implements Response {
  code: Int! @shareable
  success: Boolean! @shareable
  message: String! @shareable
  listingStatus: ListingStatus @shareable
}
type DeleteListingResponse implements Response {
  code: Int! @shareable
  success: Boolean! @shareable
  message: String! @shareable
  listing: Listing @shareable
}

type SearchResult {
  type: SearchResultType! @shareable
  listings: [Listing!]! @shareable
  totalCount: Int! @shareable
}
enum SearchResultType { LISTING USER }

# ---- Queries
type Query {
  listing(id: ID!): Listing @shareable
  homepageListings: [Listing!]! @shareable
  getNearbyListings(latitude: Float!, longitude: Float!, radius: Int!): [Listing] @shareable
  featuredListings: [Listing!]! @shareable
  hostListings: [Listing]! @shareable
  hotListingsByMoney: [Listing] @shareable
  hotListingsByBookingNumber: [Listing] @shareable
  getListingWithLocation(listingId: ID!): Listing @shareable
  fullTextSearchListings(input: FullTextSearchInput!): SearchResult! @shareable
}

# ---- Mutations
type Mutation {
  createListing(input: CreateListingInput!): CreateListingResponse! @shareable
  updateListing(listingId: ID!, listing: UpdateListingInput!): UpdateListingResponse! @shareable
  updateListingStatus(input: UpdateListingStatusInput!): UpdateListingStatusResponse @shareable
  deleteListing(listingId: ID!): String! @shareable
}
