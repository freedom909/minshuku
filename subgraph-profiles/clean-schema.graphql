extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.8"
    import: ["@key", "@shareable", "@external", "@requires", "@provides", "@override", "@inaccessible"]
  )

enum Role {
  HOST
  GUEST
  ADMIN
  USER
}

enum ProfileStatus {
  ACTIVE
  INACTIVE
  SUSPENDED
  VERIFIED
}

enum Gender {
  MALE
  FEMALE
  NON_BINARY
  PREFER_NOT_TO_SAY
}

"""
An ISO 8601-encoded UTC date string.
"""
scalar DateTime

"""
A date string in ISO format (YYYY-MM-DD).
"""
scalar Date

type Query {
  "Retrieves a single profile by username."
  profile(username: String!): Profile! @shareable

  "Retrieves a list of profiles with pagination."
  profiles(
    page: Int = 1
    limit: Int = 20
    search: String
    role: Role
    status: ProfileStatus
  ): ProfileList! @shareable

  "Fetches profile information based on a token."
  getProfileByToken(token: String!): Profile! @shareable

  "Search profiles by name, username, or interests"
  searchProfiles(
    query: String!
    page: Int = 1
    limit: Int = 20
  ): ProfileList! @shareable

  "Get profiles in user's network"
  networkProfiles(
    accountId: ID!
    page: Int = 1
    limit: Int = 20
  ): ProfileList! @shareable

  "Get profile statistics"
  profileStats(accountId: ID!): ProfileStats! @shareable
}

"""
A profile contains comprehensive metadata about a specific user.
"""
type Profile @key(fields: "id") {
  "The unique ID of the user's profile."
  id: ID!
  
  "The date and time the profile was created."
  createdAt: DateTime! @shareable
  
  "The last time the profile was updated."
  updatedAt: DateTime! @shareable
  
  "The Auth0 account tied to this profile."
  account: Account! @shareable
  
  "The full name of the user."
  fullName: String! @shareable
  
  "The unique username of the user."
  username: String! @shareable
  
  "User's bio/description"
  bio: String @shareable
  
  "User's date of birth"
  dateOfBirth: Date @shareable
  
  "User's gender"
  gender: Gender @shareable
  
  "User's phone number"
  phoneNumber: String @shareable
  
  "User's email address"
  email: String! @shareable
  
  "User's primary location"
  location: String @shareable
  
  "User's preferred language"
  language: String @shareable
  
  "User's timezone"
  timezone: String @shareable
  
  "A tag-like list of topics of interest to the user."
  interests: [String] @shareable
  
  "User's skills or expertise"
  skills: [String] @shareable
  
  "Profile status"
  status: ProfileStatus! @shareable
  
  "Whether the profile is verified"
  isVerified: Boolean! @shareable
  
  """
  Whether the currently authenticated user has another user in their network.
  """
  isInNetwork: Boolean @shareable
  
  """
  Other users that have been added to the user's network.
  """
  network: [Profile] @shareable
  
  "Network count"
  networkCount: Int! @shareable
  
  "Profile statistics"
  stats: ProfileStats @shareable
}

"""
An account is a unique Auth0 user.
"""
type Account @key(fields: "id") {
  id: ID!
  profile: Profile @shareable
}

"""
Profile statistics
"""
type ProfileStats {
  networkSize: Int! @shareable
  completedTransactions: Int! @shareable
}

"""
Paginated profile list
"""
type ProfileList {
  profiles: [Profile]! @shareable
  totalCount: Int! @shareable
  pageInfo: PageInfo! @shareable
}

"""
Pagination information
"""
type PageInfo {
  currentPage: Int! @shareable
  totalPages: Int! @shareable
  hasNextPage: Boolean! @shareable
  hasPreviousPage: Boolean! @shareable
}

"""
Provides data to create a new user profile.
"""
input CreateProfileInput {
  "The new user's unique Auth0 ID."
  accountId: ID!
  
  "The new user's full name."
  fullName: String!
  
  "The new user's username (must be unique)."
  username: String!
  
  "User's bio/description"
  bio: String
  
  "User's date of birth"
  dateOfBirth: Date
  
  "User's gender"
  gender: Gender
  
  "User's phone number"
  phoneNumber: String
  
  "User's email address"
  email: String!
  
  "User's primary location"
  location: String
  
  "User's preferred language"
  language: String
  
  "User's timezone"
  timezone: String
  
  "A tag-like list of topics of interest to the user."
  interests: [String]
  
  "User's skills or expertise"
  skills: [String]
}

"""
Input for updating profile
"""
input UpdateProfileInput {
  "The user's account ID."
  accountId: ID!
  
  "The user's full name."
  fullName: String
  
  "User's bio/description"
  bio: String
  
  "User's date of birth"
  dateOfBirth: Date
  
  "User's gender"
  gender: Gender
  
  "User's phone number"
  phoneNumber: String
  
  "User's email address"
  email: String
  
  "User's primary location"
  location: String
  
  "User's preferred language"
  language: String
  
  "User's timezone"
  timezone: String
  
  "A tag-like list of topics of interest to the user."
  interests: [String]
  
  "User's skills or expertise"
  skills: [String]
}

"""
Provides the unique ID of an existing profile to add or remove from a network.
"""
input NetworkMemberInput {
  "The unique Auth0 ID of the user that is updating their network."
  accountId: ID!
  
  "The unique Auth0 ID of the user to be added or removed from a network."
  networkMemberId: ID!
}

type Mutation {
  "Creates a new profile tied to an Auth0 account."
  createProfile(input: CreateProfileInput!): Profile! @shareable 
 
  "Updates an existing profile."
  updateProfileDetails(input: UpdateProfileInput!): Profile! @shareable
  
  "Deletes a user profile."
  deleteProfile(accountId: ID!): Boolean! @shareable
  
  "Verifies a user profile."
  verifyProfile(accountId: ID!): Profile! @shareable
  
  "Suspends a user profile."
  suspendProfile(accountId: ID!): Profile! @shareable
  
  "Activates a suspended profile."
  activateProfile(accountId: ID!): Profile! @shareable
  
  "Adds a user to a network."
  addToNetwork(input: NetworkMemberInput!): Profile! @shareable

  "Removes a user from a network."
  removeFromNetwork(input: NetworkMemberInput!): Profile! @shareable

  "Follows another user"
  followUser(followerId: ID!, followingId: ID!): Profile! @shareable

  "Unfollows another user"
  unfollowUser(followerId: ID!, followingId: ID!): Profile! @shareable
}