type Account @key(fields: "id") {
  id: ID!
  email: String!
  createdAt: String!
}

interface Account {
  id: ID!
  email: String!
  createdAt: String!
}

interface User @key(fields: "id") {
  id: ID!
  name: String!
  email: String!
  role: String!
}

type Query {
  account(id: ID!): Account
  accounts: [Account]
  user(id: ID!): User
  me: User
  viewer: Account
}