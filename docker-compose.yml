version: '3.8'

networks:
  listings_bookings_network:
    driver: bridge

services:
   mysql:
     container_name: mysql_listings_bookings
     image: mysql:latest
     environment:
       MYSQL_ROOT_PASSWORD: princess
       MYSQL_DATABASE: listings_bookings
       MYSQL_USER: root
       MYSQL_PASSWORD: princess
     volumes:
       - mysql_data:/var/lib/mysql
       - ./subgraph-listings/init.sql:/docker-entrypoint-initdb.d/init.sql
     ports:
       - "3306:3306"
     restart: always

   mongo:
     container_name: mongo_users_profile
     image: mongo:latest
     environment:
       MONGO_INITDB_ROOT_USERNAME: root
       MONGO_INITDB_ROOT_PASSWORD: rootpassword
       MONGO_INITDB_DATABASE: users_profile
     volumes:
       - mongo_data:/data/db
     ports:
       - "27017:27017"
     restart: always

volumes:
   mysql_data:
   mongo_data: